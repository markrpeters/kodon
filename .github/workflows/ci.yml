name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: validate, compile, replay, coverage (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .

  demo:
    name: build wheel, install it elsewhere, run the demo, publish the coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel into a clean environment and run the demo from another directory
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/kodon" demo | tee "$RUNNER_TEMP/demo.txt"
          "$RUNNER_TEMP/clean/bin/kodon" coverage --json > "$RUNNER_TEMP/coverage.json"
          "$RUNNER_TEMP/clean/bin/kodon" coverage > "$RUNNER_TEMP/coverage.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            ${{ runner.temp }}/coverage.json
            ${{ runner.temp }}/coverage.txt
            ${{ runner.temp }}/demo.txt

  ip-scan:
    name: ip_scan (data-hygiene gate)
    runs-on: ubuntu-latest
    env:
      # Organisation-specific terms, regex alternatives joined with "|".
      # Unset on fork PRs; the script then reports the step as skipped.
      IP_SCAN_PRIVATE_TERMS: ${{ secrets.IP_SCAN_PRIVATE_TERMS }}
    steps:
      - uses: actions/checkout@v5
      - name: Warn if private terms are not configured
        if: env.IP_SCAN_PRIVATE_TERMS == ''
        run: echo "::warning::IP_SCAN_PRIVATE_TERMS is unset; private-terms scan skipped"
      - name: Scan tracked files
        run: scripts/ip_scan.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/scan"

  ip-scan-selftest:
    name: ip_scan self-test (planted identifiers must fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/ip_scan_selftest.sh
